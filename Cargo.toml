[package]
name = "repo-gc-rust"
version = "0.1.0"
edition = "2021"
description = "AI-era Rust repository hygiene analyzer"
license = "MIT"

[[bin]]
name = "repo-gc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cargo_metadata = "0.18"
anyhow = "1"
colored = "2"
rayon = "1"

[dev-dependencies]
tempfile = "3"
