[package]
name = "repo-gc-rust"
version = "0.2.2"
edition = "2021"
description = "Finds patterns in Rust codebases that waste tokens, confuse AI agents, and break AI-assisted edits"
license = "FSL-1.1-MIT"
repository = "https://github.com/repo-gc/repo-gc-rust"

[[bin]]
name = "repo-gc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cargo_metadata = "0.18"
anyhow = "1"
colored = "2"
rayon = "1"
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
tempfile = "3"
